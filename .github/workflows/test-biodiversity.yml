name: Test biodiversity pipeline

on:
  push:
    paths:
      - "scripts/build_biodiversity.py"
      - "tests/**"
      - ".github/workflows/test-biodiversity.yml"
  pull_request:
    paths:
      - "scripts/build_biodiversity.py"
      - "tests/**"
      - ".github/workflows/test-biodiversity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
