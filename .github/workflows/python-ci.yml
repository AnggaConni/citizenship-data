name: Test biodiversity pipeline

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "biodiversity-atlas.html"
      - "regional-science.html"
      - ".github/workflows/fishstat-production.yml"
      - ".github/workflows/biodiversity-data.yml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "biodiversity-atlas.html"
      - "regional-science.html"
      - ".github/workflows/fishstat-production.yml"
      - ".github/workflows/biodiversity-data.yml"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Biodiversity Atlas JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("biodiversity-atlas.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.IGNORECASE)
          inline = "\n".join(script for script in scripts if script.strip())
          if not inline.strip():
              raise SystemExit("No inline JavaScript found in biodiversity-atlas.html")
          Path("/tmp/biodiversity-atlas.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/biodiversity-atlas.js

      - name: Check Regional Science Observatory JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("regional-science.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.IGNORECASE)
          inline = "\n".join(script for script in scripts if script.strip())
          if not inline.strip():
              raise SystemExit("No inline JavaScript found in regional-science.html")
          Path("/tmp/regional-science.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/regional-science.js
