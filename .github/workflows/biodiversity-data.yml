name: Build biodiversity country datasets

on:
  workflow_dispatch:
    inputs:
      country_code:
        description: NEXT (next country in daily rotation) or one ISO-2 country code; avoid ALL for normal incremental harvesting
        required: true
        default: NEXT
        type: string
      max_records_per_country:
        description: Maximum new unique records to append in this run (1–300; default 300)
        required: true
        default: "300"
        type: string
      grid_size_degrees:
        description: Distribution grid cell size in degrees
        required: true
        default: "0.5"
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: biodiversity-country-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test data processing helpers
        run: python -m unittest discover -s tests -v

      - name: Fetch GBIF occurrence records and build GeoJSON
        env:
          COUNTRY_CODE: ${{ inputs.country_code || 'NEXT' }}
          MAX_RECORDS: ${{ inputs.max_records_per_country || '300' }}
          GRID_SIZE: ${{ inputs.grid_size_degrees || '0.5' }}
        run: |
          # Keep the workflow resilient to empty or out-of-range dispatch inputs.
          # The Python pipeline accepts 1–300 new unique records per country per run.
          MAX_RECORDS="${MAX_RECORDS:-300}"
          if ! [[ "$MAX_RECORDS" =~ ^[0-9]+$ ]]; then
            echo "::warning::MAX_RECORDS='$MAX_RECORDS' is not an integer; using the safe default of 300."
            MAX_RECORDS=300
          elif (( MAX_RECORDS < 1 )); then
            echo "::warning::MAX_RECORDS=$MAX_RECORDS is below 1; using the safe default of 300."
            MAX_RECORDS=300
          elif (( MAX_RECORDS > 300 )); then
            echo "::warning::MAX_RECORDS=$MAX_RECORDS exceeds the per-run cap of 300; capping this run at 300."
            MAX_RECORDS=300
          fi

          echo "Incremental GBIF harvest: country=$COUNTRY_CODE, maximum new unique records=$MAX_RECORDS, grid size=$GRID_SIZE"
          ARGS=(--country "$COUNTRY_CODE" --max-records "$MAX_RECORDS" --grid-size "$GRID_SIZE")
          python scripts/build_biodiversity.py "${ARGS[@]}"

      - name: Commit updated country JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A biodiversity/
          if git diff --cached --quiet; then
            echo "No biodiversity data changes to commit."
          else
            git commit -m "Refresh GBIF country biodiversity datasets"
            git push
          fi
